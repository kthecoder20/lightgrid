<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lightgrid</title>
        <style>
            :root {
                --cols: 40;
                --rows: 40;
            }

            html,
            body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: radial-gradient(circle at center, #111 0%, #000 72%);
            }

            body {
                display: grid;
                grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
                grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
                gap: 0.08rem;
                touch-action: none;
                cursor: grab;
            }

            body::before {
                content: '';
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(circle at center, rgba(255, 255, 255, 0.04), transparent 35%);
                opacity: 0.3;
            }

            div {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                border-radius: 50%;
                background-color: #040404;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.03);
                transition: background-color 0.12s linear, border-width 0.12s linear;
            }
        </style>
        <script src="popup.js" async></script>
    </head>
    <body></body>
</html>

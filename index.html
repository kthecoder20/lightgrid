<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lightgrid</title>
        <style>
            body {
                min-width: 100vw;
                min-height: 100vh;
                margin: 0;
                padding: 0;
                display: grid;
                grid-template-columns: repeat(40, minmax(0, 1fr));
                grid-template-rows: repeat(40, minmax(0, 1fr));
                gap: 0;
                overflow: hidden;
                background-color: black;
                touch-action: none;
                cursor: grab;
            }

            div {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                border-style: solid;
                border-radius: 100%;
                background-color: black;
                border-width: 0.01rem;
                border-color: rgba(255, 255, 255, 0.08);
            }
        </style>
        <script src="popup.js" async></script>
    </head>
    <body></body>
</html>
